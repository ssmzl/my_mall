server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机 3306 被本机 MySQL 服务占用，Docker MySQL 映射在 3307
    url: jdbc:mysql://localhost:3307/my_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s
  # 仅装配客户端，启动时不做强连通校验，ES 不可达不影响应用启动
  elasticsearch:
    uris: http://localhost:9200

# name-server + producer.group 齐备后 rocketmq-spring 会创建 Producer/Consumer；
# 本地 Broker 已开启 autoCreateTopicEnable，Topic 首次发送/订阅时自动创建
rocketmq:
  name-server: localhost:9876
  producer:
    group: mall-producer
    send-message-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 不使用逻辑删除
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  jwt:
    # 开发环境密钥，生产环境通过环境变量覆盖
    secret: my-mall-dev-jwt-secret-key-0123456789abcdef
    expire-minutes: 120
  search:
    # ES 商品索引与同步 Topic（集成测试用 *_it 后缀隔离）
    product-index: mall_product
    sync-topic: mall-product-sync
    sync-consumer-group: mall-search-sync-consumer
  rocketmq:
    # RocketMQ 5.x gRPC Proxy 地址。rocketmq-spring 2.3.x 无 rocketmq.proxy 配置项，
    # 此处作为自定义属性预置，后续 MQ 业务任务据此构建 5.x 客户端
    proxy-addr: localhost:8081
  order:
    close-topic: mall-order-close
    close-consumer-group: mall-order-close-consumer
    # RocketMQ 延迟消息级别：1=1s 2=5s 3=10s 4=30s 5=1m ... 14=10m 16=30m 17=1h 18=2h
    # 默认 30s 便于联调演示超时关单，生产环境建议改为 16（30分钟）
    close-delay-level: 4
    # 下单防重 Token 有效期（分钟）
    token-ttl-minutes: 10
  seckill:
    # 秒杀下单 Topic 与消费组（集成测试用 *_it 后缀隔离）
    order-topic: mall-seckill-order
    order-consumer-group: mall-seckill-order-consumer
    # 每用户每秒最大抢购请求数（简单固定窗口限流）
    rate-limit-per-second: 3
    # 秒杀下单任务 Redis TTL（分钟），超时未出结果按失败处理
    task-ttl-minutes: 30
  # AI 智能客服（OpenAI 兼容接口，api-key 生产环境务必走环境变量覆盖）
  ai:
    # api-key 已通过环境变量 MALL_AI_API_KEY 注入（available() = enabled 且 key 非空）
    enabled: true
    llm:
      base-url: https://api.deepseek.com/v1/chat/completions
      api-key: ${MALL_AI_API_KEY:}
      # 便宜模型（DeepSeek 平台当前提供的模型以 GET /models 为准）
      model: deepseek-flash
      temperature: 0.7
      # 单次请求超时（秒），流式输出整体耗时不受此限
      connect-timeout-seconds: 10
    context:
      # Redis 多轮上下文：保留最近 N 轮对话
      max-rounds: 10
      # 上下文 Redis TTL（分钟）
      ttl-minutes: 30
    limit:
      # 用户级限流：每分钟最大消息数
      rate-limit-per-minute: 10
