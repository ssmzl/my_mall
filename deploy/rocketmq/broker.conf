# RocketMQ Broker 配置（本地开发）
brokerClusterName = DefaultCluster
brokerName = broker-a
# 0 表示 Master
brokerId = 0
# Broker 对外注册地址：宿主机 Java 客户端与容器内组件都需可达。
# 127.0.0.1 依赖 Docker 将 10911/10909 发布到宿主机回环（docker-compose ports）。
# 注意：Proxy 容器经 NS 拿到该地址后会连到自己而不可用；项目客户端走
# name-server(9876) 的 remoting 协议，不经过 Proxy，无影响。
# 若本机 hosts 的 host.docker.internal 指向正确（曾出现过过期 IP 导致超时），
# 可改回 host.docker.internal 以让 Proxy 恢复可用。
brokerIP1 = 127.0.0.1
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 本地开发开启自动创建 Topic
autoCreateTopicEnable = true
storePathRootDir = /home/rocketmq/store
