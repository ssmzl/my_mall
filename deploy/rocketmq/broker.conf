# RocketMQ Broker 配置（本地开发）
brokerClusterName = DefaultCluster
brokerName = broker-a
# 0 表示 Master
brokerId = 0
# 宿主机 / 容器内 Proxy 均需可达：Windows Docker Desktop 下用 host.docker.internal
brokerIP1 = host.docker.internal
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 本地开发开启自动创建 Topic
autoCreateTopicEnable = true
storePathRootDir = /home/rocketmq/store
